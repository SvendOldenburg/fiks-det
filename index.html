<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Reparationsliste til lejligheden -- skriv hvad der skal fikses, familien tager resten.">
  <meta name="theme-color" content="#E8734A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fiks det">
  <title>Fiks det</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="view">
    <header class="page-header">
      <img class="page-mark" src="icons/icon-192.png" alt="">
      <div>
        <h1 class="page-title">Fiks det</h1>
        <p class="page-sub">Skriv hvad der skal fikses i lejligheden</p>
      </div>
    </header>

    <form id="add-form" class="add-form">
      <input class="form-input" type="text" id="task-title" placeholder="Hvad skal fikses?" autocomplete="off" required>
      <input class="form-input" type="text" id="task-note" placeholder="Detaljer (valgfrit)" autocomplete="off">
      <button class="btn btn-primary" type="submit" id="add-btn">Tilføj</button>
      <p id="add-error" class="form-error hidden"></p>
    </form>

    <div id="task-list" class="task-list"></div>

    <button id="toggle-done" class="link-btn hidden" type="button">Vis afsluttede opgaver</button>
    <div id="done-list" class="task-list hidden"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
